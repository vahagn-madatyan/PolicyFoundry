[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-foundry"
version = "0.2.2"
description = "AI-powered firewall policy management"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
readme = "README.md"
authors = [
    {name = "Vahagn Madatyan"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Firewalls",
]

dependencies = [
    "aiofiles>=25.1.0",
    "boto3>=1.40.61",
    "duckdb>=1.5.0",
    "fpdf2>=2.8",
    "instructor[litellm]>=1.14.5",
    "litellm==1.83.1",  # Pinned: 1.82.7/1.82.8 compromised, package quarantined on PyPI
    "langgraph>=1.1.0",
    "openpyxl>=3.1.5",
    "pyarrow>=23.0.1",
    "pydantic>=2.12",
    "pydantic-settings[yaml]>=2.13",
    "pytz>=2026.1.post1",
    "rich>=14.0",
    "typer>=0.24.1",
]

[project.urls]
Homepage = "https://github.com/vahagn-madatyan/PolicyFoundry"
Repository = "https://github.com/vahagn-madatyan/PolicyFoundry"
Issues = "https://github.com/vahagn-madatyan/PolicyFoundry/issues"

[project.scripts]
policyfoundry = "policyfoundry.__main__:main"

[project.entry-points."policyfoundry.adapters"]
aws_sg = "policyfoundry.adapters.aws_sg:AwsSecurityGroupAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/policyfoundry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "moto[s3]>=5.0",
    "pytest-asyncio>=0.25",
]
