[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policyfoundry"
version = "0.1.0"
description = "AI-powered firewall policy management"
license = {text = "BSL-1.1"}
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "aiofiles>=25.1.0",
    "boto3>=1.40.61",
    "duckdb>=1.5.0",
    "instructor[litellm]>=1.14.5",
    "langgraph>=1.1.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.12",
    "pydantic-settings[yaml]>=2.13",
    "pytz>=2026.1.post1",
    "rich>=14.0",
    "typer>=0.24.1",
]

[project.scripts]
policyfoundry = "policyfoundry.__main__:main"

[project.entry-points."policyfoundry.adapters"]
aws_sg = "policyfoundry.adapters.aws_sg:AwsSecurityGroupAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/policyfoundry"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "moto[s3]>=5.0",
    "pytest-asyncio>=0.25",
]
